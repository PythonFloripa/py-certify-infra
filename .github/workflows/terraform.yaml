name: Terraform

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente alvo'
        type: choice
        options:
          - both
          - dev
          - shared
        default: both
      pr_number:
        description: 'Número do PR para planejar e comentar (opcional)'
        type: string
        default: ''
      apply:
        description: 'Executar apply (somente na main)'
        type: boolean
        default: false

env:
  TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
  TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
  TF_VAR_github_actions_role_arn: ${{ secrets.GH_ACTIONS_ROLE_ARN }}
  TF_VAR_service_url_registration_api_solana: ${{ secrets.SERVICE_URL_REGISTRATION_API_SOLANA }}
  TF_VAR_service_api_key_registration_api_solana: ${{ secrets.SERVICE_API_KEY_REGISTRATION_API_SOLANA }}
  TF_VAR_tech_floripa_certificate_validate_url: ${{ secrets.TECH_FLORIPA_CERTIFICATE_VALIDATE_URL }}
  TF_VAR_api_key_value: ${{ secrets.API_KEY_VALUE }}
  TFPLAN_S3_BUCKET: tech-floripa-plan-artifacts
  GH_TOKEN: ${{ github.token }}

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
      target_ref: ${{ steps.compute.outputs.target_ref }}
    steps:
      - name: Guard - apply somente na main
        if: ${{ inputs.apply && github.ref_name != 'main' }}
        run: |
          echo "::error::apply só pode rodar na branch main (ref atual: ${{ github.ref_name }})."
          exit 1

      - name: Computar matriz e ref alvo
        id: compute
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          PR_NUMBER: ${{ inputs.pr_number }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            dev)    matrix='{"include":[{"dir":"terraform/env/dev","env":"dev"}]}' ;;
            shared) matrix='{"include":[{"dir":"terraform","env":"shared"}]}' ;;
            both)   matrix='{"include":[{"dir":"terraform","env":"shared"},{"dir":"terraform/env/dev","env":"dev"}]}' ;;
            *)      echo "::error::environment inválido: $ENVIRONMENT"; exit 1 ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

          if [ -n "$PR_NUMBER" ]; then
            echo "target_ref=refs/pull/${PR_NUMBER}/head" >> "$GITHUB_OUTPUT"
          else
            echo "target_ref=${DISPATCH_REF}" >> "$GITHUB_OUTPUT"
          fi

  plan:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.setup.outputs.target_ref }}

      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TF_VAR_github_actions_role_arn }}
          aws-region: ${{ env.TF_VAR_aws_region }}
          role-session-name: TerraformPlanSession-${{ matrix.env }}

      - name: Terraform Plan
        working-directory: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          terraform init -input=false -upgrade=false
          terraform plan -input=false -out=tfplan
          terraform show -no-color tfplan > plan-output.txt
          {
            echo "## Terraform Plan (${{ matrix.env }})"
            echo '```hcl'
            cat plan-output.txt
            echo '```'
          } > plan-comment.md

      - name: Comentar plan no PR
        if: ${{ inputs.pr_number != '' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: terraform-plan-${{ matrix.env }}
          number: ${{ inputs.pr_number }}
          recreate: true
          path: ${{ matrix.dir }}/plan-comment.md

  apply:
    needs: [setup, plan]
    if: ${{ inputs.apply && github.ref_name == 'main' && inputs.pr_number == '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TF_VAR_github_actions_role_arn }}
          aws-region: ${{ env.TF_VAR_aws_region }}
          role-session-name: TerraformApplySession-${{ matrix.env }}

      - uses: ./.github/actions/tf_apply
        with:
          working-directory: ${{ matrix.dir }}
          env: ${{ matrix.env }}
